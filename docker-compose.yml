services:
  radar:
    build: .
    image: freebie-radar:latest
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8788}:8788"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: "8788"
      HOST: "0.0.0.0"
      DATABASE_PATH: /data/radar.db
      TZ: ${TZ:-Asia/Shanghai}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - radar
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选：采集 linux.do 等带 Cloudflare 护盾的站点时可一起启动：
  # docker compose --profile cf up -d --build
  # 并在 .env 设置 FLARESOLVERR_URL=http://flaresolverr:8191
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: ["cf"]
    restart: unless-stopped
    mem_limit: 400m
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-Asia/Shanghai}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
