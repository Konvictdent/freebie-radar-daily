name: Deploy VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_ADMIN_TOKEN: ${{ secrets.VPS_ADMIN_TOKEN }}
      VPS_WEB_PASSWORD: ${{ secrets.VPS_WEB_PASSWORD }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}

    steps:
      - name: Prepare SSH key
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/vps_key
          chmod 600 /tmp/vps_key

      - name: Install htpasswd
        run: sudo apt-get update -y && sudo apt-get install -y apache2-utils

      - name: Write env file
        run: |
          umask 077
          cat > /tmp/freebie.env <<EOF
          PORT=8788
          HOST=0.0.0.0
          BIND_ADDRESS=127.0.0.1
          DATABASE_PATH=./data/radar.db
          TZ=Asia/Shanghai
          ADMIN_TOKEN=${VPS_ADMIN_TOKEN}
          RATE_LIMIT_ENABLED=true
          TRUST_PROXY=true
          WEBHOOK_ALLOW_PRIVATE=false
          ENABLE_SCHEDULER=true
          COLLECT_CRON=0 */2 * * *
          DAILY_CRON=30 8 * * *
          DAILY_TOP_N=12
          SITE_MODE=selfhost
          GUEST_HIDDEN_CATEGORIES=pan,course
          PUBLIC_BASE_URL=https://107.173.19.29.sslip.io
          PUSH_CHANNEL=pushplus
          PUSHPLUS_TOKEN=${PUSHPLUS_TOKEN}
          AI_BASE_URL=https://opencode.ai/zen/go/v1
          AI_API_KEY=${OPENCODE_GO_API_KEY}
          AI_MODEL=deepseek-v4.1-flash
          AI_EXTRA_HEADERS='{"x-opencode-session":"freebie-radar-vps"}'
          AI_MAX_ITEMS=40
          HTTP_PROXY=
          HTTPS_PROXY=
          GITHUB_TOKEN=
          EOF
          chmod 600 /tmp/freebie.env

      - name: Write Caddyfile
        run: |
          set -euo pipefail
          umask 077
          BASIC_HASH=$(htpasswd -nbB admin "$VPS_WEB_PASSWORD" | cut -d: -f2)
          cat > /tmp/Caddyfile <<'EOF'
          107.173.19.29.sslip.io {
            basic_auth {
              admin __BASIC_HASH__
            }
            reverse_proxy radar:8788
            encode gzip
            header {
              Strict-Transport-Security "max-age=31536000; includeSubDomains"
              X-Content-Type-Options "nosniff"
              X-Frame-Options "DENY"
              Referrer-Policy "no-referrer"
              -Server
            }
          }
          EOF
          sed -i "s|__BASIC_HASH__|$BASIC_HASH|" /tmp/Caddyfile
          chmod 600 /tmp/Caddyfile

      - name: Copy env and deploy
        run: |
          set -euo pipefail
          SSHOPTS="-i /tmp/vps_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
          scp $SSHOPTS /tmp/freebie.env /tmp/Caddyfile root@"$VPS_HOST":/tmp/
          ssh $SSHOPTS root@"$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if command -v apt-get >/dev/null; then
            apt-get update -y
            apt-get install -y git curl ca-certificates
          elif command -v dnf >/dev/null; then
            dnf install -y git curl ca-certificates
          fi
          if ! command -v docker >/dev/null; then
            curl -fsSL https://get.docker.com | sh
          fi
          if ! docker compose version >/dev/null 2>&1; then
            if command -v apt-get >/dev/null; then apt-get install -y docker-compose-plugin; fi
          fi
          systemctl enable --now docker || true
          if [ -d /opt/freebie-radar/.git ]; then
            cd /opt/freebie-radar
            git fetch origin
            git reset --hard origin/main
          else
            rm -rf /opt/freebie-radar
            git clone https://github.com/Konvictdent/freebie-radar-daily.git /opt/freebie-radar
            cd /opt/freebie-radar
          fi
          mkdir -p data
          install -m 600 /tmp/freebie.env .env
          install -m 600 /tmp/Caddyfile Caddyfile
          rm -f /tmp/freebie.env /tmp/Caddyfile
          if command -v ufw >/dev/null && ufw status | grep -q "Status: active"; then ufw allow 8788/tcp || true; fi
          if command -v firewall-cmd >/dev/null && firewall-cmd --state >/dev/null 2>&1; then
            firewall-cmd --permanent --add-port=8788/tcp || true
            firewall-cmd --reload || true
          fi
          docker compose up -d --build
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8788/health >/dev/null; then ok=1; break; fi
            sleep 3
          done
          docker compose ps
          if [ "$ok" != "1" ]; then
            docker compose logs --tail=80
            exit 1
          fi
          echo HEALTH_OK
          REMOTE

      - name: Verify HTTPS and basic auth
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "admin:$VPS_WEB_PASSWORD" "https://107.173.19.29.sslip.io/health" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          echo "authed=$code"
          test "$code" = "200"
          unauth=$(curl -s -o /dev/null -w '%{http_code}' "https://107.173.19.29.sslip.io/" || true)
          echo "unauth=$unauth"
          test "$unauth" = "401"
          echo HTTPS_OK

      - name: Show Caddy logs on failure
        if: failure()
        run: |
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$VPS_HOST" 'cd /opt/freebie-radar && docker compose logs --tail=100 caddy' || true
