name: Freebie Radar Daily

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freebie-radar-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
      DATABASE_PATH: ./data/radar.db
      SITE_MODE: selfhost
      ADMIN_TOKEN: ""
      ENABLE_SCHEDULER: "false"
      DAILY_TOP_N: "12"
      GUEST_HIDDEN_CATEGORIES: "pan,course"
      PUSH_CHANNEL: pushplus
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      AI_BASE_URL: https://opencode.ai/zen/go/v1
      AI_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      AI_MODEL: deepseek-v4.1-flash
      AI_EXTRA_HEADERS: '{"x-opencode-session":"freebie-radar-actions"}'
      AI_MAX_ITEMS: "40"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare data directory
        run: mkdir -p data

      - name: Restore radar database
        uses: actions/cache/restore@v4
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: |
            radar-db-

      - name: Collect sources
        run: node --import tsx src/server/cli.ts collect

      - name: Send daily digest
        run: node --import tsx src/server/cli.ts daily

      - name: Save radar database
        if: always() && hashFiles('data/radar.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}
