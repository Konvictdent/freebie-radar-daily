name: VPS Diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Prepare SSH key
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/vps_key
          chmod 600 /tmp/vps_key

      - name: Run diagnostics
        run: |
          set -euo pipefail
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/freebie-radar
          echo "=== host date ==="
          date
          date -u
          cat /etc/timezone 2>/dev/null || true
          timedatectl 2>/dev/null | head -6 || true
          echo "=== container date/env ==="
          docker compose exec -T radar date
          docker compose exec -T radar printenv TZ DAILY_CRON COLLECT_CRON ENABLE_SCHEDULER PUSH_CHANNEL || true
          echo "=== containers ==="
          docker compose ps
          docker inspect freebie-radar-radar-1 --format '{{json .State}}' || true
          echo "=== resources ==="
          free -h
          df -h /
          uptime
          echo "=== radar logs since 12h ==="
          docker compose logs --since 12h radar | tail -200
          echo "=== digests ==="
          docker compose exec -T radar node --no-warnings -e "const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('/data/radar.db');console.log(JSON.stringify(db.prepare('SELECT date,pushed_at,item_ids FROM digests ORDER BY date DESC LIMIT 5').all()));db.close()" || true
          echo "=== oom ==="
          dmesg 2>/dev/null | grep -i -E 'killed process|out of memory|oom' | tail -20 || true
          REMOTE
