name: VPS Diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Prepare SSH key
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/vps_key
          chmod 600 /tmp/vps_key

      - name: Run diagnostics
        run: |
          set -euo pipefail
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/freebie-radar
          echo "=== host ==="
          date
          date -u
          cat /etc/timezone 2>/dev/null || true
          timedatectl 2>/dev/null | head -6 || true
          echo "=== container ==="
          docker compose exec -T radar sh -lc 'date; echo TZ=$TZ; echo DAILY_CRON=$DAILY_CRON; echo COLLECT_CRON=$COLLECT_CRON; echo ENABLE_SCHEDULER=$ENABLE_SCHEDULER; echo PUSH_CHANNEL=$PUSH_CHANNEL; node -e "console.log(new Date().toString(), new Date().getHours(), Intl.DateTimeFormat().resolvedOptions().timeZone)"' </dev/null
          echo "=== containers ==="
          docker compose ps
          docker inspect freebie-radar-radar-1 --format '{{json .State}}' || true
          echo "=== resources ==="
          free -h
          df -h /
          uptime
          echo "=== logs ==="
          docker compose logs --since 24h radar | tail -300
          echo "=== digests ==="
          docker compose exec -T radar node --no-warnings -e "const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('/data/radar.db');console.log(JSON.stringify(db.prepare('SELECT date,pushed_at,item_ids FROM digests ORDER BY date DESC LIMIT 5').all()));db.close()" </dev/null || true
          echo "=== latest brief ==="
          docker compose exec -T radar node --no-warnings -e "const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('/data/radar.db');const r=db.prepare('SELECT date,pushed_at,payload FROM digests ORDER BY date DESC LIMIT 1').get();const p=r?JSON.parse(r.payload):{};console.log(JSON.stringify({date:r?.date,pushed_at:r?.pushed_at,count:p.count,brief:p.brief}));db.close()" </dev/null || true
          echo "=== horizon ==="
          systemctl show horizon-daily.service -p ActiveState -p SubState -p Result -p Environment || true
          systemd-analyze verify /etc/systemd/system/horizon-daily.service 2>&1 | tail -20 || true
          systemctl list-timers horizon-daily.timer --no-pager || true
          journalctl -u horizon-daily.service -n 40 --no-pager || true
          free -h
          echo "=== oom ==="
          dmesg 2>/dev/null | grep -i -E 'killed process|out of memory|oom' | tail -20 || true
          REMOTE
